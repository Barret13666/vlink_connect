# Повседневные проверки VLink Connect.
#
# Отладочный APK собирается на каждый толчок в репозиторий и лежит в
# артефактах прогона. Заодно проверяется, что собирается прошивка моста:
# ошибку в ней иначе видно только на столе, с платой в руках.
#
# Выпуски здесь НЕ собираются — этим занимается release.yml. Держать сборку
# релиза в двух файлах нельзя: два прогона на один тег наперегонки создавали
# бы один и тот же релиз и перетирали чужие файлы.

name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:

  debug:
    name: Тесты и отладочный APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Компоненты Android SDK
        # На раннере SDK есть, но набор платформ меняется от образа к
        # образу. Просим нужную явно, чтобы сборка не зависела от того,
        # что сегодня оказалось в системе.
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Где лежит проект
        # Ищем корень Gradle сами: у проекта была подпапка android/, и
        # перепутать раскладку легко. Явная ошибка здесь понятнее, чем
        # «Directory does not contain a Gradle build» из недр Gradle.
        id: root
        run: |
          if   [ -f settings.gradle.kts ];         then D=.
          elif [ -f android/settings.gradle.kts ]; then D=android
          else
            echo "settings.gradle.kts не найден ни в корне, ни в android/."
            echo "Содержимое корня:"; ls -la
            exit 1
          fi
          echo "Корень проекта: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - name: Тесты и сборка
        # Обёртка появляется, как только проект открывали в Android Studio.
        # Пока её нет, берём Gradle, поставленный шагом выше.
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          if [ -x ./gradlew ]; then RUN=./gradlew; else RUN=gradle; fi
          $RUN --no-daemon test assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: vlink-connect-debug
          path: ${{ steps.root.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

