# Выпуск приложения VLink Connect: подписанный APK и релиз на GitHub.
#
# Запускается на тег вида v1.0 либо руками (тогда тег спрашивается в поле
# ввода). Повседневные проверки живут в build.yml и здесь не повторяются.
#
# ВАЖНО: сборку релиза из build.yml надо убрать, иначе два прогона на один
# тег будут наперегонки создавать один и тот же релиз и перетирать чужие
# файлы. В прилагаемом build.yml это уже сделано.
#
# Прошивки модуля и моста здесь не собираются и в релиз не кладутся — они
# живут в репозитории исходниками, и прошивают их из Arduino IDE.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег для выпуска, например v1.0"
        required: true

# Два прогона на один тег не нужны. Отменяем предыдущий, а не ставим в
# очередь: догоняющий всё равно перезапишет результат.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:

  release:
    name: Подписанный APK и релиз
    # Одним заданием намеренно: собирать в одном, а публиковать в другом
    # означало бы гонять APK через артефакты и тянуть версию через outputs.
    # Делить тут нечего — ничто не идёт параллельно.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Номер версии из тега
        id: ver
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          TAG="${MANUAL_TAG:-${GITHUB_REF#refs/tags/}}"
          case "$TAG" in
            v*) ;;
            *) echo "Тег должен начинаться с v, получено: '$TAG'"; exit 1 ;;
          esac
          echo "Тег: $TAG"
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"   >> "$GITHUB_OUTPUT"

      - name: Где лежит проект
        # Ищем корень Gradle сами: у проекта была подпапка android/, и
        # перепутать раскладку легко. Явная ошибка здесь понятнее, чем
        # «Directory does not contain a Gradle build» из недр Gradle.
        id: root
        run: |
          if   [ -f settings.gradle.kts ];         then D=.
          elif [ -f android/settings.gradle.kts ]; then D=android
          else
            echo "settings.gradle.kts не найден ни в корне, ни в android/."
            echo "Содержимое корня:"; ls -la
            exit 1
          fi
          echo "Корень проекта: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Достать ключ подписи
        # Без ключа выпуск собирать бессмысленно: APK, подписанный
        # одноразовым отладочным ключом, нельзя обновить поверх прежнего —
        # Android считает такие сборки разными приложениями.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Секрет KEYSTORE_BASE64 не задан. Как его завести — в README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Тесты и сборка
        # VERSION_NAME и VERSION_CODE подхватывает build.gradle.kts. Без них
        # каждый выпуск сообщал бы о себе одну и ту же версию из исходников,
        # и телефон отказывался бы ставить новый APK поверх прежнего:
        # versionCode обязан расти.
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.ver.outputs.version }}
          VERSION_CODE: ${{ github.run_number }}
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          if [ -x ./gradlew ]; then RUN=./gradlew; else RUN=gradle; fi
          $RUN --no-daemon test assembleRelease

      - name: Проверить подпись и переименовать
        # Тихо собранный неподписанный APK — худший из исходов: выглядит
        # готовым, ставится на чистый телефон и не ставится поверх прежнего.
        # Лучше узнать об этом здесь, чем от людей после выпуска.
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          if [ -z "$APK" ]; then echo "APK не собрался"; exit 1; fi
          echo "Файл: $APK"
          case "$APK" in
            *unsigned*)
              echo "APK не подписан. Проверьте секреты подписи и signingConfigs."
              exit 1 ;;
          esac
          BT=$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --verbose "$APK"

          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/vlink-connect-${{ steps.ver.outputs.version }}.apk"
          ls -la "$GITHUB_WORKSPACE/release"

      - name: Текст релиза
        run: |
          {
            echo "## Установка"
            echo
            echo "Скачайте \`vlink-connect-${{ steps.ver.outputs.version }}.apk\`"
            echo "и разрешите установку из этого источника."
            echo
            echo "Прошивки модуля и моста в релиз не входят: они лежат в"
            echo "репозитории исходниками и прошиваются из Arduino IDE."
            echo
            echo "### Две вещи, о которые спотыкаются чаще всего"
            echo
            echo "**Модуль ждёт минуту.** Служебный доступ открыт только"
            echo "первую минуту после подачи питания. Не успели — снимите и"
            echo "подайте питание снова."
            echo
            echo "**Привязанный мост UART-дисплея занимает модуль** с первой"
            echo "секунды после включения, а занятый модуль в эфире не"
            echo "объявляется: его не увидит ни приложение, ни VESC Tool."
            echo "Это не поломка, а признак работы. Чтобы вернуть модуль"
            echo "телефону, снимите питание с моста."
          } > NOTES.md
          cat NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: VLink Connect ${{ steps.ver.outputs.version }}
          body_path: NOTES.md
          # Список изменений из истории коммитов GitHub допишет под нашим
          # текстом — руками его вести незачем.
          generate_release_notes: true
          files: release/*.apk
          fail_on_unmatched_files: true
